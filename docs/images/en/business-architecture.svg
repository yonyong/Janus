<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7FD"/>
    </linearGradient>
    <linearGradient id="gradIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad)"/>

  <!-- header -->
  <text x="60" y="52" font-size="11" font-weight="600" letter-spacing="3" fill="#818CF8">BUSINESS ARCHITECTURE</text>
  <text x="60" y="88" font-size="26" font-weight="700" fill="#0F172A">Business Architecture</text>
  <text x="1140" y="86" font-size="13" fill="#64748B" text-anchor="end">Token sharing · Immersive workbench · Pluggable agents</text>

  <!-- role cards -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="116" width="280" height="68" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <circle cx="176" cy="150" r="16" fill="url(#gradIndigo)"/>
  <circle cx="176" cy="146.5" r="4.5" fill="#FFFFFF"/>
  <path d="M168 158 a8 8 0 0 1 16 0 z" fill="#FFFFFF"/>
  <text x="204" y="148" font-size="15" font-weight="700" fill="#0F172A">Administrator</text>
  <text x="204" y="167" font-size="11.5" fill="#64748B">Holds the admin passphrase</text>

  <g filter="url(#cardShadow)">
    <rect x="780" y="116" width="280" height="68" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <circle cx="816" cy="150" r="16" fill="url(#gradBlue)"/>
  <circle cx="816" cy="146.5" r="4.5" fill="#FFFFFF"/>
  <path d="M808 158 a8 8 0 0 1 16 0 z" fill="#FFFFFF"/>
  <text x="844" y="148" font-size="15" font-weight="700" fill="#0F172A">Business User</text>
  <text x="844" y="167" font-size="11.5" fill="#64748B">Holds a ?token= share link</text>

  <line x1="280" y1="184" x2="280" y2="228" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="920" y1="184" x2="920" y2="228" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- platform card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="232" width="1080" height="348" rx="18" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <rect x="90" y="256" width="4" height="22" rx="2" fill="url(#gradIndigo)"/>
  <text x="106" y="274" font-size="18" font-weight="700" fill="#0F172A">Janus Platform</text>
  <text x="1110" y="272" font-size="12" fill="#94A3B8" text-anchor="end">Local-first deployment</text>

  <!-- admin console sub-card -->
  <rect x="90" y="296" width="470" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="110" y="326" font-size="14.5" font-weight="700" fill="#0F172A">Admin Console</text>
  <circle cx="116" cy="352" r="3" fill="#818CF8"/>
  <text x="128" y="357" font-size="12.5" fill="#475569">Projects: register local absolute paths</text>
  <circle cx="116" cy="378" r="3" fill="#818CF8"/>
  <text x="128" y="383" font-size="12.5" fill="#475569">Tokens: notes · five expiry options · re-reveal</text>
  <circle cx="116" cy="404" r="3" fill="#818CF8"/>
  <text x="128" y="409" font-size="12.5" fill="#475569">Sessions · audit · quota in one console</text>

  <!-- workbench sub-card -->
  <rect x="590" y="296" width="520" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="610" y="326" font-size="14.5" font-weight="700" fill="#0F172A">Immersive Workbench</text>
  <g>
    <rect x="610" y="344" width="112" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="666" y="368" font-size="12" font-weight="700" fill="#6366F1" text-anchor="middle">01</text>
    <text x="666" y="386" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Clarify</text>
    <text x="666" y="401" font-size="9.5" fill="#94A3B8" text-anchor="middle">Doc editing</text>
    <rect x="736" y="344" width="112" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="792" y="368" font-size="12" font-weight="700" fill="#6366F1" text-anchor="middle">02</text>
    <text x="792" y="386" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Verify</text>
    <text x="792" y="401" font-size="9.5" fill="#94A3B8" text-anchor="middle">Use cases</text>
    <rect x="862" y="344" width="112" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="918" y="368" font-size="12" font-weight="700" fill="#6366F1" text-anchor="middle">03</text>
    <text x="918" y="386" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Build</text>
    <text x="918" y="401" font-size="9.5" fill="#94A3B8" text-anchor="middle">Agent coding</text>
    <rect x="988" y="344" width="112" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1044" y="368" font-size="12" font-weight="700" fill="#6366F1" text-anchor="middle">04</text>
    <text x="1044" y="386" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Archive</text>
    <text x="1044" y="401" font-size="9.5" fill="#94A3B8" text-anchor="middle">Verdict</text>
    <text x="729" y="382" font-size="16" fill="#CBD5E1" text-anchor="middle">&#8250;</text>
    <text x="855" y="382" font-size="16" fill="#CBD5E1" text-anchor="middle">&#8250;</text>
    <text x="981" y="382" font-size="16" fill="#CBD5E1" text-anchor="middle">&#8250;</text>
  </g>

  <!-- capability chips -->
  <text x="90" y="490" font-size="12.5" font-weight="700" fill="#334155">Common capabilities <tspan font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="1">SHARED</tspan></text>
  <g>
    <rect x="90" y="504" width="246" height="48" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="213" y="533" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Agent chat panel</text>
    <rect x="348" y="504" width="246" height="48" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="471" y="533" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Workspace file preview</text>
    <rect x="606" y="504" width="246" height="48" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="729" y="533" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Change records &amp; rollback</text>
    <rect x="864" y="504" width="246" height="48" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="987" y="533" font-size="13" font-weight="600" fill="#4338CA" text-anchor="middle">Doc version history</text>
  </g>

  <!-- engine row -->
  <line x1="490" y1="580" x2="490" y2="620" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <g filter="url(#cardShadow)">
    <rect x="330" y="624" width="320" height="72" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <text x="490" y="654" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Agent Engine</text>
  <text x="490" y="675" font-size="11.5" fill="#64748B" text-anchor="middle">fake · codebuddy adapters · one-click probe</text>

  <line x1="650" y1="660" x2="742" y2="660" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrAccent)"/>
  <text x="696" y="648" font-size="11" font-weight="600" fill="#6366F1" text-anchor="middle" style="paint-order:stroke" stroke="#FFFFFF" stroke-width="5">Subprocess CLI</text>

  <g filter="url(#cardShadow)">
    <rect x="746" y="624" width="330" height="72" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <text x="911" y="654" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Local Project Workspace</text>
  <text x="911" y="675" font-size="11.5" fill="#64748B" text-anchor="middle">disk_path · snapshot read/write · git-free</text>
</svg>
