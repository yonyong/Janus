<svg width="1240" height="960" viewBox="0 0 1240 960" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7FD"/>
    </linearGradient>
    <linearGradient id="gradIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect width="1240" height="960" fill="url(#bgGrad)"/>

  <!-- header -->
  <text x="60" y="52" font-size="11" font-weight="600" letter-spacing="3" fill="#818CF8">TECHNICAL ARCHITECTURE</text>
  <text x="60" y="88" font-size="26" font-weight="700" fill="#0F172A">技术架构</text>
  <text x="1180" y="86" font-size="13" fill="#64748B" text-anchor="end">FastAPI · SQLite · SSE · 单进程</text>

  <!-- browser band -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="130" width="760" height="150" rx="16" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <rect x="110" y="152" width="4" height="20" rx="2" fill="url(#gradIndigo)"/>
  <text x="126" y="168" font-size="14.5" font-weight="700" fill="#0F172A">浏览器 <tspan font-size="11.5" font-weight="500" fill="#64748B">React 18 · Vite · TypeScript · Ant Design 6</tspan></text>
  <g>
    <rect x="110" y="188" width="230" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="225" y="216" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">AuthProvider 统一登录</text>
    <rect x="352" y="188" width="270" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="487" y="216" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Workbench 四阶段工作台</text>
    <rect x="634" y="188" width="196" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="732" y="216" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">FileViewer · ChatPanel</text>
  </g>

  <line x1="470" y1="280" x2="470" y2="326" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrAccent)"/>
  <text x="492" y="308" font-size="12" font-weight="700" fill="#6366F1" style="paint-order:stroke" stroke="#FFFFFF" stroke-width="5">REST + SSE</text>

  <!-- backend band -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="330" width="760" height="270" rx="16" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <rect x="110" y="352" width="4" height="20" rx="2" fill="url(#gradIndigo)"/>
  <text x="126" y="368" font-size="14.5" font-weight="700" fill="#0F172A">后端 <tspan font-size="11.5" font-weight="500" fill="#64748B">FastAPI（单进程）</tspan></text>
  <text x="830" y="366" font-size="11" fill="#94A3B8" text-anchor="end">stdlib sqlite3 · 零重依赖</text>
  <g>
    <rect x="110" y="384" width="360" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="126" y="406" font-size="12.5" font-weight="700" fill="#0F172A">app.py</text>
    <text x="126" y="424" font-size="11" fill="#64748B">路由 · 鉴权 · SSE · 静态托管</text>
    <rect x="490" y="384" width="340" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="506" y="406" font-size="12.5" font-weight="700" fill="#0F172A">session_service</text>
    <text x="506" y="424" font-size="11" fill="#64748B">幂等 · 中止 · 落库</text>
    <rect x="110" y="448" width="360" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="126" y="470" font-size="12.5" font-weight="700" fill="#0F172A">snapshots.py</text>
    <text x="126" y="488" font-size="11" fill="#64748B">工作区快照 · 改动回退</text>
    <rect x="490" y="448" width="340" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="506" y="470" font-size="12.5" font-weight="700" fill="#0F172A">files · docs · ai_tasks · audit</text>
    <text x="506" y="488" font-size="11" fill="#64748B">文件读写 · 文档镜像 · AI 任务 · 审计</text>
  </g>
  <rect x="110" y="516" width="720" height="52" rx="10" fill="url(#gradIndigo)"/>
  <text x="470" y="548" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">agent_runtime — CodingAgentProvider 协议 + 注册表（可插拔扩展）</text>

  <line x1="470" y1="600" x2="470" y2="646" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrAccent)"/>
  <text x="492" y="628" font-size="12" font-weight="700" fill="#6366F1" style="paint-order:stroke" stroke="#FFFFFF" stroke-width="5">spawn 子进程</text>

  <!-- adapters band -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="650" width="760" height="110" rx="16" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <rect x="110" y="672" width="4" height="20" rx="2" fill="url(#gradIndigo)"/>
  <text x="126" y="688" font-size="14.5" font-weight="700" fill="#0F172A">适配器 <tspan font-size="11.5" font-weight="500" fill="#64748B">Adapter（子进程）</tspan></text>
  <g>
    <rect x="110" y="700" width="420" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="126" y="719" font-size="12.5" font-weight="700" fill="#0F172A">codebuddy.py</text>
    <text x="126" y="737" font-size="11" fill="#64748B">stdin JSON → stdout JSON-lines</text>
    <rect x="550" y="700" width="150" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="625" y="719" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">fake.py</text>
    <text x="625" y="737" font-size="11" fill="#64748B" text-anchor="middle">联调</text>
  </g>

  <line x1="470" y1="760" x2="470" y2="806" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- bottom row -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="810" width="280" height="64" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <text x="230" y="837" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Coding Agent CLI</text>
  <text x="230" y="856" font-size="11" fill="#64748B" text-anchor="middle">实现同协议的任意 CLI</text>

  <line x1="370" y1="842" x2="448" y2="842" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrAccent)"/>

  <g filter="url(#cardShadow)">
    <rect x="452" y="810" width="398" height="64" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <text x="651" y="837" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">本地项目工作区</text>
  <text x="651" y="856" font-size="11" fill="#64748B" text-anchor="middle">disk_path · 运行前后快照 · 逐文件回退</text>

  <!-- right rail: db -->
  <line x1="850" y1="420" x2="906" y2="420" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <g filter="url(#cardShadow)">
    <rect x="910" y="384" width="270" height="74" rx="14" fill="#FFFFFF" stroke="#E7ECF5"/>
  </g>
  <ellipse cx="940" cy="406" rx="12" ry="4.5" fill="none" stroke="#6366F1" stroke-width="1.6"/>
  <path d="M928 406 v22 a12 4.5 0 0 0 24 0 v-22" fill="none" stroke="#6366F1" stroke-width="1.6"/>
  <text x="962" y="414" font-size="14" font-weight="700" fill="#0F172A">SQLite</text>
  <text x="962" y="434" font-size="11" fill="#64748B">data/app.db · 单文件存储</text>

  <!-- right rail: deploy note -->
  <rect x="910" y="478" width="270" height="92" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
  <rect x="910" y="478" width="4" height="92" rx="2" fill="#F59E0B"/>
  <text x="930" y="508" font-size="13" font-weight="700" fill="#92400E">单 worker 部署约束</text>
  <text x="930" y="530" font-size="11" fill="#A16207">运行去重与回放状态在进程内存，</text>
  <text x="930" y="548" font-size="11" fill="#A16207">多实例会重复调用 Agent。</text>
</svg>
